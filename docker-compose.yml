version: '3.8'

services:
  backend:
    build:
      context: ./backend
    ports:
      - "10000:10000"
    environment:
      - PORT=10000
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    volumes:
      - ./backend:/app
      - /app/node_modules

  frontend:
    build:
      context: ./frontend
    ports:
      - "5173:80"
    environment:
      - VITE_API_BASE_URL=http://localhost:10000
    depends_on:
      - backend
